name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
        rails: ["6.1", "7.0", "7.1", "7.2", "8.0", "8.1"]
        exclude:
          # Rails 6.1 predates Ruby 4.0's default gem removals
          - { rails: "6.1", ruby: "4.0" }
          # Rails 7.2 requires Ruby 3.1+
          - { rails: "7.2", ruby: "3.0" }
          # Rails 8 requires Ruby 3.2+
          - { rails: "8.0", ruby: "3.0" }
          - { rails: "8.0", ruby: "3.1" }
          - { rails: "8.1", ruby: "3.0" }
          - { rails: "8.1", ruby: "3.1" }
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
